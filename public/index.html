<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Turnos – Estética</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-fuchsia-950 text-white">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="h-10 w-10 rounded-2xl bg-gradient-to-br from-fuchsia-400 to-pink-500"></div>
        <div>
          <h1 class="text-xl font-semibold">Gestión de Turnos</h1>
          <p class="text-sm text-white/70">Estética</p>
        </div>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-sm text-white/80">Email</label>
          <input id="email" type="email" required
                 class="mt-1 w-full rounded-xl bg-slate-900/60 border border-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-fuchsia-400"
                 placeholder="tu@email.com" />
        </div>

        <div>
          <label class="text-sm text-white/80">Contraseña</label>
          <input id="password" type="password" required minlength="6"
                 class="mt-1 w-full rounded-xl bg-slate-900/60 border border-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-fuchsia-400"
                 placeholder="••••••••" />
        </div>

        <button class="w-full rounded-xl py-3 font-semibold bg-gradient-to-r from-fuchsia-500 to-pink-500 hover:opacity-95 transition">
          Iniciar sesión
        </button>

        <p id="msg" class="text-sm text-pink-200"></p>

        <div class="text-center text-sm text-white/70">
          ¿No tenés cuenta?
          <a class="text-fuchsia-300 hover:text-fuchsia-200 underline" href="/register.html">Crear cuenta</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
