<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · Gestión de Turnos</title>
   <link rel="icon" type="image/svg+xml" href="./images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md rounded-3xl border border-white/10 bg-slate-900/60 backdrop-blur-md border border-white/10 p-8">
      <h1 class="text-xl font-semibold mb-1">Iniciar sesión</h1>
      <p class="text-sm text-white/70 mb-6">Ingresá para administrar tus turnos.</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="text-sm text-white/80">Email</label>
          <input id="email" type="email" required
                 class="mt-1 w-full rounded-xl bg-slate-900/60 border border-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-fuchsia-400"
                 placeholder="tu@email.com" />
        </div>

        <div>
          <label class="text-sm text-white/80">Contraseña</label>
          <input id="password" type="password" required minlength="6"
                 class="mt-1 w-full rounded-xl bg-slate-900/60 border border-white/10 px-4 py-3 outline-none focus:ring-2 focus:ring-fuchsia-400"
                 placeholder="tu contraseña" />
        </div>

        <button class="w-full rounded-xl py-3 font-semibold bg-fuchsia-600 hover:bg-fuchsia-500 hover:opacity-95 transition">
          Entrar
        </button>

        <p id="msg" class="text-sm text-pink-200"></p>

        <div class="text-center text-sm text-white/70">
          ¿No tenés cuenta?
          <a class="text-fuchsia-300 hover:text-fuchsia-200 underline" href="/register.html">Crear cuenta</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
